modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="@paeromc on YouTube"
displayTest="IGNORE_SERVER_VERSION"
description='''
A speedbuilding mod made by @paeromc for his YouTube channel.
Learn each build with a preview, beat the countdown and check
your accuracy against the clock. Requires WorldEdit.
'''

[[mixins]]
config="paerospeedbuilder.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="worldedit"
    type="required"
    versionRange="[7.3.5,)"
    ordering="AFTER"
    side="BOTH"
